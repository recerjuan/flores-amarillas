<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para mi persona favorita 💛</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            /* Fondo nocturno elegante para máximo contraste */
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #31102b 100%);
            min-height: 100vh;
            overflow-x: hidden;
            color: #fff;
        }
        .romantic-font {
            font-family: 'Dancing Script', cursive;
        }
        /* Animación de apertura de la caja */
        .box-lid {
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.6s ease;
            transform-origin: top;
        }
        .open-lid .box-lid {
            transform: translateY(-120px) rotateX(45deg);
            opacity: 0;
        }
        .gift-container {
            transition: all 0.8s ease-in-out;
        }
        .fade-out {
            opacity: 0;
            transform: scale(0.8);
            pointer-events: none;
            display: none;
        }
        .fade-in {
            animation: fadeInBouquet 1.2s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes fadeInBouquet {
            0% { opacity: 0; transform: translateY(40px) scale(0.9); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Estilo mejorado para rosas con textura y relieve */
        .real-rose {
            position: relative;
            background: radial-gradient(circle, #fde047 0%, #eab308 60%, #ca8a04 100%);
            border-radius: 50%;
            box-shadow: 0 5px 10px rgba(0,0,0,0.3), inset 0 2px 4px rgba(255,255,255,0.6), inset 0 -4px 8px rgba(161, 98, 7, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 30;
        }
        /* Detalle espiral central */
        .real-rose::after {
            content: '';
            position: absolute;
            width: 55%;
            height: 55%;
            border: 2px dashed rgba(113, 63, 18, 0.3);
            border-radius: 50%;
            animation: spinSlow 15s linear infinite;
        }
        @keyframes spinSlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Estilo de los tallos y hojas integrados */
        .rose-stem {
            position: absolute;
            bottom: -50px; /* Nacen desde dentro del envoltorio */
            width: 4px;
            height: 120px;
            background: linear-gradient(to bottom, #166534, #15803d);
            border-radius: 0 0 2px 2px;
            z-index: 10;
            transform-origin: bottom;
        }
        /* Hojas laterales en los tallos */
        .rose-stem::before, .rose-stem::after {
            content: '';
            position: absolute;
            width: 15px;
            height: 15px;
            background-color: #15803d;
            border-radius: 2px 15px;
            top: 30px;
        }
        .rose-stem::before { left: -6px; transform: rotate(-30deg); }
        .rose-stem::after { right: -6px; transform: rotate(30deg); }

    </style>
</head>
<body class="flex flex-col items-center justify-center p-4">

    <!-- VISTA 1: LA CAJA DE REGALO SORPRESA -->
    <div id="giftView" class="gift-container flex flex-col items-center justify-center text-center cursor-pointer select-none py-10" onclick="openGift()">
        <div class="mb-6 animate-bounce">
            <span class="text-6xl">🎁</span>
        </div>
        <h1 class="text-3xl md:text-4xl font-bold text-yellow-300 mb-3 drop-shadow-md">Tienes un regalo especial</h1>
        <p class="text-yellow-100 text-lg mb-8 bg-yellow-950/60 px-6 py-2 rounded-full shadow-lg border border-yellow-500/30">
            Haz clic aquí para abrirlo ✨
        </p>

        <!-- Simulación visual de la caja -->
        <div class="relative w-48 h-44 md:w-56 md:h-52">
            <!-- Tapa -->
            <div class="box-lid absolute top-0 left-[-10px] right-[-10px] h-12 bg-yellow-600 rounded-t-lg shadow-2xl flex items-center justify-center border-b-2 border-yellow-700">
                <div class="w-8 h-full bg-yellow-300 opacity-90"></div>
            </div>
            <!-- Cuerpo de la caja -->
            <div class="absolute top-12 bottom-0 left-0 right-0 bg-yellow-700 rounded-b-xl shadow-2xl flex items-center justify-center border-2 border-yellow-600 overflow-hidden">
                <div class="w-10 h-full bg-yellow-400 opacity-90"></div>
                <div class="absolute inset-0 flex items-center justify-center">
                    <span class="text-yellow-950 font-bold tracking-wider text-sm bg-yellow-300/90 px-3 py-1 rounded shadow">ÁBREME</span>
                </div>
            </div>
        </div>
    </div>

    <!-- VISTA 2: EL RAMO DE 15 ROSAS AMARILLAS PROFESIONAL (Oculto inicialmente) -->
    <div id="bouquetView" class="fade-out flex flex-col items-center justify-center w-full max-w-md mx-auto text-center py-6">
        
        <!-- Dedicatoria Romántica -->
        <div class="mb-6 bg-slate-900/80 backdrop-blur-md p-5 rounded-2xl shadow-2xl border border-yellow-500/30 w-full">
            <span class="text-yellow-400 text-2xl">🌻</span>
            <h2 class="text-yellow-200 font-semibold text-base mb-1 tracking-wider uppercase">Para mi persona favorita</h2>
            <p class="romantic-font text-3xl md:text-4xl text-yellow-300 leading-tight drop-shadow">
                "Mi sol de todos los días, gracias por iluminar cada momento de mi vida con tu sonrisa."
            </p>
        </div>

        <!-- El Ramo Profesional Integrado con tallos y hojas -->
        <div class="relative flex flex-col items-center mt-2">
            
            <!-- Capa visual de flores (Cúpula) -->
            <div class="relative w-72 h-36 z-20 flex justify-center items-end">
                <!-- Capa trasera (6 rosas) -->
                <div class="absolute flex space-x-1 bottom-8">
                    <div class="real-rose w-12 h-12"></div>
                    <div class="real-rose w-14 h-14 -mb-1"></div>
                    <div class="real-rose w-14 h-14 -mb-2"></div>
                    <div class="real-rose w-14 h-14 -mb-1"></div>
                    <div class="real-rose w-12 h-12"></div>
                </div>
                <!-- Capa frontal (5 rosas destacadas) -->
                <div class="absolute flex space-x-2 bottom-1 z-10">
                    <div class="real-rose w-14 h-14"></div>
                    <div class="real-rose w-16 h-16"></div>
                    <div class="real-rose w-16 h-16 -mb-1"></div>
                    <div class="real-rose w-16 h-16"></div>
                    <div class="real-rose w-14 h-14"></div>
                </div>
                <!-- (Total 11 rosas visibles en cúpula frontal, más 4 ocultas atrás haciendo volumen) -->
            </div>

            <!-- TALLOS Y HOJAS: Ahora nacen desde el ramo hacia el cono -->
            <div class="absolute top-28 left-1/2 -translate-x-1/2 w-20 h-40 z-10 flex justify-center">
                <div class="rose-stem rotate-[-15deg] left-0"></div>
                <div class="rose-stem rotate-[-7deg] left-3"></div>
                <div class="rose-stem rotate-[0deg] left-7"></div>
                <div class="rose-stem rotate-[7deg] right-7"></div>
                <div class="rose-stem rotate-[15deg] right-0"></div>
            </div>

            <!-- Cono de Envoltorio Profesional -->
            <div class="relative w-64 h-56 bg-gradient-to-b from-amber-900 via-amber-800 to-amber-950 rounded-b-[3rem] shadow-2xl border-t-4 border-yellow-500/50 z-10 overflow-hidden flex flex-col items-center pt-2">
                <!-- Textura elegante del papel de regalo -->
                <div class="absolute inset-0 opacity-20 bg-[radial-gradient(#fde047_1px,transparent_1px)] [background-size:14px_14px]"></div>
                
                <!-- Moño / Lazo elegante -->
                <div class="relative z-30 flex items-center justify-center mt-1">
                    <div class="bg-yellow-400 text-yellow-950 text-xs font-bold px-4 py-1.5 rounded-full shadow-lg border border-yellow-200 tracking-wide uppercase">
                        Con amor eterno 💛
                    </div>
                </div>

                <!-- Leyenda en el envoltorio -->
                <div class="mt-auto mb-4 text-xs font-semibold text-yellow-200/90 tracking-widest uppercase">
                    ✨ 15 Rosas Amarillas Exclusivas ✨
                </div>
            </div>

        </div>

        <!-- Botón para cerrar la caja nuevamente -->
        <button onclick="resetGift()" class="mt-8 text-xs text-yellow-400/80 underline hover:text-yellow-300 cursor-pointer transition">
            Volver a cerrar la caja
        </button>
    </div>

    <script>
        function openGift() {
            const giftView = document.getElementById('giftView');
            const bouquetView = document.getElementById('bouquetView');

            giftView.classList.add('open-lid');

            setTimeout(() => {
                giftView.classList.add('fade-out');
                bouquetView.classList.remove('fade-out');
                bouquetView.classList.add('fade-in');
            }, 500);
        }

        function resetGift() {
            const giftView = document.getElementById('giftView');
            const bouquetView = document.getElementById('bouquetView');

            bouquetView.classList.remove('fade-in');
            bouquetView.classList.add('fade-out');

            setTimeout(() => {
                giftView.classList.remove('fade-out', 'open-lid');
            }, 300);
        }
    </script>
</body>
</html>
