<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para mi persona favorita 💛</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #31102b 100%);
            min-height: 100vh;
            overflow-x: hidden;
            color: #fff;
        }
        .romantic-font {
            font-family: 'Dancing Script', cursive;
        }
        /* Animación de apertura de la caja */
        .box-lid {
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.6s ease;
            transform-origin: top;
        }
        .open-lid .box-lid {
            transform: translateY(-120px) rotateX(45deg);
            opacity: 0;
        }
        .gift-container {
            transition: all 0.8s ease-in-out;
        }
        .fade-out {
            opacity: 0;
            transform: scale(0.8);
            pointer-events: none;
            display: none;
        }
        .fade-in {
            animation: fadeInBouquet 1.2s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes fadeInBouquet {
            0% { opacity: 0; transform: translateY(40px) scale(0.9); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-4">

    <!-- VISTA 1: LA CAJA DE REGALO SORPRESA -->
    <div id="giftView" class="gift-container flex flex-col items-center justify-center text-center cursor-pointer select-none py-10" onclick="openGift()">
        <div class="mb-6 animate-bounce">
            <span class="text-6xl">🎁</span>
        </div>
        <h1 class="text-3xl md:text-4xl font-bold text-yellow-300 mb-3 drop-shadow-md">Tienes un regalo especial</h1>
        <p class="text-yellow-100 text-lg mb-8 bg-yellow-950/60 px-6 py-2 rounded-full shadow-lg border border-yellow-500/30">
            Haz clic aquí para abrirlo ✨
        </p>

        <!-- Simulación visual de la caja -->
        <div class="relative w-48 h-44 md:w-56 md:h-52">
            <!-- Tapa -->
            <div class="box-lid absolute top-0 left-[-10px] right-[-10px] h-12 bg-yellow-600 rounded-t-lg shadow-2xl flex items-center justify-center border-b-2 border-yellow-700">
                <div class="w-8 h-full bg-yellow-300 opacity-90"></div>
            </div>
            <!-- Cuerpo de la caja -->
            <div class="absolute top-12 bottom-0 left-0 right-0 bg-yellow-700 rounded-b-xl shadow-2xl flex items-center justify-center border-2 border-yellow-600 overflow-hidden">
                <div class="w-10 h-full bg-yellow-400 opacity-90"></div>
                <div class="absolute inset-0 flex items-center justify-center">
                    <span class="text-yellow-950 font-bold tracking-wider text-sm bg-yellow-300/90 px-3 py-1 rounded shadow">ÁBREME</span>
                </div>
            </div>
        </div>
    </div>

    <!-- VISTA 2: EL RAMO IDÉNTICO A TU REFERENCIA (Oculto inicialmente) -->
    <div id="bouquetView" class="fade-out flex flex-col items-center justify-center w-full max-w-md mx-auto text-center py-4">
        
        <!-- Dedicatoria Romántica -->
        <div class="mb-4 bg-slate-900/90 backdrop-blur-md p-4 rounded-2xl shadow-2xl border border-yellow-500/30 w-full">
            <span class="text-yellow-400 text-xl">🌻</span>
            <h2 class="text-yellow-200 font-semibold text-xs mb-1 tracking-wider uppercase">Para mi persona favorita</h2>
            <p class="romantic-font text-3xl md:text-4xl text-yellow-300 leading-tight drop-shadow">
                "Mi sol de todos los días, gracias por iluminar cada momento de mi vida con tu sonrisa."
            </p>
        </div>

        <!-- Ramo Estilizado Exacto a la Foto -->
        <div class="relative flex flex-col items-center drop-shadow-2xl">
            <svg viewBox="0 0 300 380" class="w-72 h-96">
                <defs>
                    <!-- Gradiente para el papel envoltorio (tono rosado/crema elegante como en tu foto) -->
                    <linearGradient id="wrapperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#fbcfe8" />
                        <stop offset="50%" stop-color="#f472b6" />
                        <stop offset="100%" stop-color="#db2777" />
                    </linearGradient>
                    <!-- Gradiente para el lazo -->
                    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#f43f5e" />
                        <stop offset="50%" stop-color="#fb7185" />
                        <stop offset="100%" stop-color="#f43f5e" />
                    </linearGradient>
                </defs>

                <!-- 1. El Cono de Envoltorio (Forma idéntica a tu imagen de referencia) -->
                <path d="M 90,140 Q 150,130 210,140 L 180,310 Q 150,330 120,310 Z" fill="url(#wrapperGrad)" stroke="#be185d" stroke-width="2" />
                
                <!-- Líneas decorativas de doblez en el papel -->
                <g stroke="#f472b6" stroke-width="1.5" opacity="0.6" fill="none">
                    <path d="M 150,132 L 135,315" />
                    <path d="M 150,132 L 165,315" />
                    <path d="M 150,132 L 105,250" />
                    <path d="M 150,132 L 195,250" />
                </g>

                <!-- 2. Follaje verde esponjoso que sale de la parte superior del cono -->
                <g fill="#22c55e" stroke="#15803d" stroke-width="1.5">
                    <circle cx="110" cy="140" r="28" />
                    <circle cx="130" cy="125" r="32" />
                    <circle cx="150" cy="120" r="35" />
                    <circle cx="170" cy="125" r="32" />
                    <circle cx="190" cy="140" r="28" />
                    <circle cx="100" cy="155" r="24" />
                    <circle cx="200" cy="155" r="24" />
                </g>

                <!-- 3. Las 15 Rosas Amarillas compactas en la parte superior -->
                <g>
                    <!-- Función de mini rosa detallada y compacta -->
                    <!-- Fila Trasera -->
                    <circle cx="115" cy="125" r="14" fill="#ca8a04" />
                    <circle cx="115" cy="125" r="11" fill="#eab308" />
                    <circle cx="115" cy="125" r="7" fill="#facc15" />

                    <circle cx="135" cy="115" r="15" fill="#ca8a04" />
                    <circle cx="135" cy="115" r="12" fill="#eab308" />
                    <circle cx="135" cy="115" r="8" fill="#fde047" />

                    <circle cx="165" cy="115" r="15" fill="#ca8a04" />
                    <circle cx="165" cy="115" r="12" fill="#eab308" />
                    <circle cx="165" cy="115" r="8" fill="#fde047" />

                    <circle cx="185" cy="125" r="14" fill="#ca8a04" />
                    <circle cx="185" cy="125" r="11" fill="#eab308" />
                    <circle cx="185" cy="125" r="7" fill="#facc15" />

                    <!-- Fila Central -->
                    <circle cx="95" cy="140" r="14" fill="#ca8a04" />
                    <circle cx="95" cy="140" r="11" fill="#eab308" />
                    <circle cx="95" cy="140" r="7" fill="#facc15" />

                    <circle cx="120" cy="132" r="15" fill="#ca8a04" />
                    <circle cx="120" cy="132" r="12" fill="#eab308" />
                    <circle cx="120" cy="132" r="8" fill="#fde047" />

                    <circle cx="150" cy="125" r="16" fill="#ca8a04" />
                    <circle cx="150" cy="125" r="13" fill="#eab308" />
                    <circle cx="150" cy="125" r="9" fill="#fef08a" />

                    <circle cx="180" cy="132" r="15" fill="#ca8a04" />
                    <circle cx="180" cy="132" r="12" fill="#eab308" />
                    <circle cx="180" cy="132" r="8" fill="#fde047" />

                    <circle cx="205" cy="140" r="14" fill="#ca8a04" />
                    <circle cx="205" cy="140" r="11" fill="#eab308" />
                    <circle cx="205" cy="140" r="7" fill="#facc15" />

                    <!-- Fila Frontal (Las más destacadas) -->
                    <circle cx="105" cy="155" r="14" fill="#ca8a04" />
                    <circle cx="105" cy="155" r="11" fill="#eab308" />
                    <circle cx="105" cy="155" r="7" fill="#facc15" />

                    <circle cx="135" cy="145" r="16" fill="#ca8a04" />
                    <circle cx="135" cy="145" r="13" fill="#eab308" />
                    <circle cx="135" cy="145" r="9" fill="#fef08a" />

                    <circle cx="165" cy="145" r="16" fill="#ca8a04" />
                    <circle cx="165" cy="145" r="13" fill="#eab308" />
                    <circle cx="165" cy="145" r="9" fill="#fef08a" />

                    <circle cx="195" cy="155" r="14" fill="#ca8a04" />
                    <circle cx="195" cy="155" r="11" fill="#eab308" />
                    <circle cx="195" cy="155" r="7" fill="#facc15" />

                    <circle cx="150" cy="160" r="15" fill="#ca8a04" />
                    <circle cx="150" cy="160" r="12" fill="#eab308" />
                    <circle cx="150" cy="160" r="8" fill="#fde047" />
                </g>

                <!-- 4. El Lazo / Moño elegante amarrado en la parte angosta del cono -->
                <g>
                    <!-- Listones laterales del moño -->
                    <path d="M 135,270 Q 110,290 100,310 Q 130,290 138,275 Z" fill="url(#ribbonGrad)" />
                    <path d="M 165,270 Q 190,290 200,310 Q 170,290 162,275 Z" fill="url(#ribbonGrad)" />
                    <!-- Nudo central y orejas del moño -->
                    <ellipse cx="138" cy="265" rx="14" ry="9" fill="#e11d48" transform="rotate(-15 138 265)" />
                    <ellipse cx="162" cy="265" rx="14" ry="9" fill="#e11d48" transform="rotate(15 162 265)" />
                    <circle cx="150" cy="267" r="8" fill="#9f1239" />
                </g>
            </svg>
        </div>

        <!-- Botón para cerrar la caja nuevamente -->
        <button onclick="resetGift()" class="mt-4 text-xs text-yellow-400/80 underline hover:text-yellow-300 cursor-pointer transition">
            Volver a cerrar la caja
        </button>
    </div>

    <script>
        function openGift() {
            const giftView = document.getElementById('giftView');
            const bouquetView = document.getElementById('bouquetView');

            giftView.classList.add('open-lid');

            setTimeout(() => {
                giftView.classList.add('fade-out');
                bouquetView.classList.remove('fade-out');
                bouquetView.classList.add('fade-in');
            }, 500);
        }

        function resetGift() {
            const giftView = document.getElementById('giftView');
            const bouquetView = document.getElementById('bouquetView');

            bouquetView.classList.remove('fade-in');
            bouquetView.classList.add('fade-out');

            setTimeout(() => {
                giftView.classList.remove('fade-out', 'open-lid');
            }, 300);
        }
    </script>
</body>
</html>
